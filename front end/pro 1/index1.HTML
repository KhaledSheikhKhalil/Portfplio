<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>

    <header>
        <div class="logo">
            <span>
            <img src="./photo_2026-10-12_01-06-14.jpg" alt="" width="50" height="50">
            </span>
            </div>
        </header>
        <hr>
    <nav>
        <h3>(List):</h3>
        <ul>
            <li>العنصر الأول</li>
            <li>العنصر الثاني</li>
            <li>العنصر الثالث</li>
            <li>العنصر الرابع</li>
        </ul>
    </nav>
        <hr>
    
    <section>
        <h3>(Media):</h3>
        <div class="media-container">
            <div>
                <h4>(Image):</h4>
                <img src="./images.jpg" alt="" width="100" height="100">
            </div>
            <hr>
            <div>
                <h4>(Video):</h4>
                    <video controls  width="150" height="150">
                    <source src="./20260316_014707.mp4">
                </video>
            </div>
            <hr>
            <div>
                <h4>(Audio):</h4>
                <audio controls>
                    <source src="./ابيتهوفن_روعة_الحربMP3_160K.mp3" type="audio/mpeg">
                </audio>
            </div>

        </div>
    </section>
        <hr>
    <section>
        <h3>(Form):</h3>
        <form action="#" method="post">
            <div>
                <label for="username">الاسم:</label><br>
                <input type="text" id="username" name="username" placeholder="أدخل اسمك">
            </div>
            <div>
                <label for="email">البريد الإلكتروني:</label><br>
                <input type="email" id="email" name="email" placeholder="example@domain.com">
            </div>
            <div>
                <label for="message">الرسالة:</label><br>
                <textarea id="message" name="message" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            <div>
                <input type="submit" value="إرسال">
            </div>
        </form>
    </section>
        <hr>
    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
